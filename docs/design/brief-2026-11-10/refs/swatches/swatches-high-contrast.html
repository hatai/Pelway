<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>HC Round2 CVD</title>
<style>
*{box-sizing:border-box}body{margin:0;font:400 13px/1.5 "Geist","Noto Sans CJK JP",sans-serif;background:#B8B7B1}
h1{font-size:14px;margin:10px 12px 2px}.lead{margin:0 12px 8px;font-size:11px;color:#3A3935}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
.col{border-radius:14px;padding:11px}.col h2{margin:0 0 6px;font:600 12px/16px "Geist Mono",monospace}
.stage{border-radius:12px;padding:9px}.tile{border-radius:11px;padding:9px}.well{border-radius:9px;padding:7px;margin-top:7px}
.btn{display:inline-flex;align-items:center;height:27px;padding:0 10px;border-radius:8px;font-weight:500;font-size:12px;margin:0 4px 4px 0;border:0}
.focus{outline:2px solid var(--focus);outline-offset:2px}
.av{width:30px;height:30px;display:inline-grid;place-items:center;font-size:11px;font-weight:600;margin-right:5px}
.circ{border-radius:50%}.sq{border-radius:9px}
.ai{display:inline-flex;font:500 10px/14px "Geist Mono",monospace;padding:0 4px;border-radius:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px/16px "Geist Mono",monospace;border-radius:7px;padding:2px 7px;margin:4px 4px 0 0}
.chip svg{width:12px;height:12px}
.ring{display:flex;gap:3px;margin-top:7px;height:6px}.ring i{flex:1;border-radius:2px}
.ring i.todo{background:repeating-linear-gradient(135deg,var(--track) 0 2px,transparent 2px 4px);background-color:var(--track)}
.row{display:flex;align-items:center;gap:6px;margin-top:7px;padding:5px 7px;border-radius:8px;position:relative}
.row.sel{background:var(--wash)}.row.sel::before,.row.pend::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px}
.row.sel::before{background:var(--acc)}.row.pend::before{background:var(--ink)}
.unread{width:8px;height:8px;border-radius:50%;background:var(--unread);display:inline-block}
.toast{border-radius:10px;padding:7px 9px;font-size:12px;margin-top:7px}.body{margin:5px 0 0;font-size:12px}.link{color:var(--link);text-decoration:underline}
.LH{--fill:#2B36FF;--on:#FFFFFF;--wash:#E3E5FF;--focus:#2B36FF;--hum:#3A3935;--humfg:#F8F8F4;--aibg:#2B36FF;--aifg:#FFFFFF;--badgebg:#E3E5FF;--badgef:#2B36FF;--toastbg:#141416;--toastfg:#F8F8F4;--pri:#141416;--prifg:#F8F8F4;--dangbg:#FBE4E0;--dangfg:#B42318;--warnbg:#F7ECD6;--warnfg:#8A5A00;--sucbg:#D8EDE2;--sucfg:#1B5E3B;--hov:#2530E6;--prs:#1F29CC;--bg:#E6E5E0;--tile:#F8F8F4;--well:#EEEEE9;--ink:#141416;--track:#D9D9D2;--acc:#2B36FF;--unread:#2B36FF;--link:#2B36FF;background:var(--bg);color:var(--ink)}
.DH{--fill:#8F96FF;--on:#121214;--wash:#2A2C4A;--focus:#8F96FF;--hum:#C9C7C0;--humfg:#121214;--aibg:#8F96FF;--aifg:#121214;--badgebg:#2A2C4A;--badgef:#8F96FF;--toastbg:#EDEBE6;--toastfg:#121214;--pri:#8F96FF;--prifg:#121214;--dangbg:#3D1E1B;--dangfg:#FF8A7A;--warnbg:#3A2E14;--warnfg:#E0B65A;--sucbg:#1A2A1A;--sucfg:#8FDBA0;--hov:#A5ABFF;--prs:#7D85F2;--bg:#121214;--tile:#1C1C1F;--well:#26262A;--ink:#EDEBE6;--track:#3A3A40;--acc:#8F96FF;--unread:#8F96FF;--link:#8F96FF;background:var(--bg);color:var(--ink)}
.col .stage{background:var(--bg)}.col .tile{background:var(--tile)}.col .well{background:var(--well)}
</style></head><body>
<h1>Round2 export · high-contrast · CVD用</h1>
<p class="lead">書き出しトークン値。Machado 2009 を画素適用。</p>
<div class="grid">
<div class="col LH"><h2>light-high-contrast</h2><div class="stage"><div class="tile">
  <span class="btn" style="background:var(--fill);color:var(--on)">送信</span>
  <span class="btn" style="background:var(--hov);color:var(--on)">hover</span>
  <span class="btn" style="background:var(--prs);color:var(--on)">pressed</span>
  <span class="btn focus" style="background:var(--fill);color:var(--on)">focus</span><br>
  <span class="av circ" style="background:var(--hum);color:var(--humfg)">濱</span>
  <span class="av sq" style="background:var(--aibg);color:var(--aifg)">リ</span>
  <span class="ai" style="background:var(--badgebg);color:var(--badgef)">AI</span>
  <div class="well"><span class="btn" style="background:var(--fill);color:var(--on);margin:0">送信</span></div>
  <div class="ring"><i style="background:var(--fill)"></i><i style="background:var(--fill)"></i><i class="todo"></i></div>
  <div class="row sel"><span class="unread"></span><strong>未読 3</strong></div>
  <div class="row pend" style="background:var(--well)"><span style="font-size:11px">承認待ち</span></div>
  <span class="chip" style="background:var(--dangbg);color:var(--dangfg)"><svg viewBox="0 0 12 12"><polygon points="3.5,1 8.5,1 11,3.5 11,8.5 8.5,11 3.5,11 1,8.5 1,3.5" fill="currentColor"/></svg>危険</span>
  <span class="chip" style="background:var(--warnbg);color:var(--warnfg)"><svg viewBox="0 0 12 12"><polygon points="6,1.2 11,10.5 1,10.5" fill="currentColor"/></svg>注意</span>
  <span class="chip" style="background:var(--sucbg);color:var(--sucfg)">✓ 完了</span>
  <div class="toast" style="background:var(--toastbg);color:var(--toastfg)">下書きを保存しました</div>
  <p class="body">本文。<a class="link" href="#">リンクは下線</a>。</p>
</div></div></div>
<div class="col DH"><h2>dark-high-contrast</h2><div class="stage"><div class="tile">
  <span class="btn" style="background:var(--fill);color:var(--on)">送信</span>
  <span class="btn" style="background:var(--hov);color:var(--on)">hover</span>
  <span class="btn" style="background:var(--prs);color:var(--on)">pressed</span>
  <span class="btn focus" style="background:var(--fill);color:var(--on)">focus</span><br>
  <span class="av circ" style="background:var(--hum);color:var(--humfg)">濱</span>
  <span class="av sq" style="background:var(--aibg);color:var(--aifg)">リ</span>
  <span class="ai" style="background:var(--badgebg);color:var(--badgef)">AI</span>
  <div class="well"><span class="btn" style="background:var(--fill);color:var(--on);margin:0">送信</span></div>
  <div class="ring"><i style="background:var(--fill)"></i><i style="background:var(--fill)"></i><i class="todo"></i></div>
  <div class="row sel"><span class="unread"></span><strong>未読 3</strong></div>
  <div class="row pend" style="background:var(--well)"><span style="font-size:11px">承認待ち</span></div>
  <span class="chip" style="background:var(--dangbg);color:var(--dangfg)"><svg viewBox="0 0 12 12"><polygon points="3.5,1 8.5,1 11,3.5 11,8.5 8.5,11 3.5,11 1,8.5 1,3.5" fill="currentColor"/></svg>危険</span>
  <span class="chip" style="background:var(--warnbg);color:var(--warnfg)"><svg viewBox="0 0 12 12"><polygon points="6,1.2 11,10.5 1,10.5" fill="currentColor"/></svg>注意</span>
  <span class="chip" style="background:var(--sucbg);color:var(--sucfg)">✓ 完了</span>
  <div class="toast" style="background:var(--toastbg);color:var(--toastfg)">下書きを保存しました</div>
  <p class="body">本文。<a class="link" href="#">リンクは下線</a>。</p>
</div></div></div>
</div></body></html>
