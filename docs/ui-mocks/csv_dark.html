<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>AI協業チャット 仕様変更の一日（モック・ダーク）</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6E5E0;--tile:#F8F8F4;--well:#EEEEE9;--ink:#111214;--sub:#5A5852;--mute:#66635B;--acc:#2B37FF;--accw:#E3E5FF;--r:24px;--sh:0 1px 2px rgba(17,18,20,.05),0 10px 30px rgba(17,18,20,.06)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/24px "Geist","Noto Sans JP",sans-serif;height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:20px;height:100vh}
.app.pane{grid-template-columns:220px minmax(0,1fr) 400px}
.t{background:var(--tile);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;min-height:0;position:relative}
.mono{font-family:"Geist Mono","Noto Sans JP",monospace}
.cap{display:flex;align-items:center;gap:8px;font:400 12px/16px "Geist Mono","Noto Sans JP";color:var(--mute)}
.cap:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
.cap.n:before{background:var(--ink)}
/* rail */
.rail{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.org{font-weight:600;font-size:15px}
.who{font:400 11px/16px "Geist Mono","Noto Sans JP";color:var(--mute);margin:2px 0 14px}
.it{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:12px;font-size:14px;color:var(--sub);text-align:left;width:100%}
.it:hover{background:var(--well)}
.it.on{background:var(--accw);color:var(--acc);font-weight:600}
.it.b{color:var(--ink);font-weight:600}
.it .c{margin-left:auto;font:600 11px/18px "Geist Mono";background:var(--acc);color:#fff;border-radius:9px;min-width:20px;padding:0 6px;text-align:center}
.it.on .c{background:var(--acc)}
.grp{font:400 11px/16px "Geist Mono","Noto Sans JP";color:var(--mute);margin:14px 10px 4px}
.mini{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:600;background:var(--well);color:var(--ink);flex:none}
.mini.ai{background:var(--acc);color:#fff}
.sl{margin-left:auto;font:500 10px/14px "Geist Mono","Noto Sans JP";color:var(--mute)}.sl.w{color:var(--acc)}.sl.n{color:var(--ink)}
.ctl{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.sc{font:400 11px/16px "Geist Mono","Noto Sans JP";color:var(--mute)}
.sc b{display:block;font:500 13px/18px "Geist","Noto Sans JP";color:var(--ink);margin-top:2px}
.row{display:flex;gap:6px}
.cb{flex:1;height:36px;border-radius:18px;background:var(--well);font-weight:500;font-size:13px}
.cb.p{background:var(--ink);color:#F8F8F4}
.cb:disabled{opacity:.35;cursor:default}
.note{font-size:11px;line-height:16px;color:var(--mute)}
/* main */
.main{display:flex;flex-direction:column;overflow:hidden;padding:0}
.top{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--well)}
.srch{margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:var(--well);color:var(--mute);font-size:13px;width:260px}
.srch .k{margin-left:auto;font:500 11px/16px "Geist Mono";color:var(--sub)}
.body{flex:1;overflow:auto;padding:24px 22px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-weight:500;font-size:22px;line-height:28px;letter-spacing:-.01em}
.mem{font-size:13px;color:var(--mute)}
.day{font:400 11px/16px "Geist Mono";color:var(--mute);text-align:center}
.unread{display:flex;align-items:center;gap:10px;font:500 11px/16px "Geist Mono","Noto Sans JP";color:var(--acc)}
.unread:after{content:"";flex:1;height:1px;background:var(--acc)}
.m{display:flex;gap:12px;border-radius:14px;padding:6px 8px;margin:-6px -8px}
.m.hl{background:var(--accw)}
.av{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--well)}
.av.ai{background:var(--acc);color:#fff}
.nm{font-size:13px;line-height:20px;color:var(--mute)}.nm b{color:var(--ink);font-weight:500;margin-right:6px}
.tag{font:500 10px/14px "Geist Mono";color:var(--acc);box-shadow:inset 0 0 0 1px currentColor;border-radius:6px;padding:0 4px;margin-right:6px}
.at{color:var(--acc);font-weight:500}
.rx{display:flex;gap:6px;margin-top:6px}
.pill{height:24px;padding:0 9px;border-radius:12px;background:var(--well);font-size:12px;display:inline-flex;align-items:center;gap:4px;color:var(--sub)}
.dec{margin-top:6px;display:inline-flex;align-items:center;gap:6px;font:500 11px/16px "Geist Mono","Noto Sans JP";color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:8px;padding:2px 8px}
.thl{margin-top:8px;display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--acc);font-weight:500;background:var(--well);border-radius:12px;padding:5px 12px}
.thl .s{color:var(--sub);font-weight:400}
.wk{display:inline-flex;align-items:center;gap:6px}.wk:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
.ho{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);background:var(--well);border-radius:14px;padding:9px 14px}
.ho b{color:var(--ink);font-weight:500}
.ho .lk{margin-left:auto}
.lk{color:var(--acc);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.wait{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px}.wait:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
.see{font-size:13px;font-weight:500;color:var(--acc);margin-left:8px}
.priv{font:400 11px/16px "Geist Mono","Noto Sans JP";color:var(--mute);margin-top:4px}
.comp{margin-top:auto;padding:0 22px 18px}
.comp div{max-width:720px;margin:0 auto;background:var(--well);border-radius:16px;height:48px;display:flex;align-items:center;padding:0 18px;color:var(--mute);font-size:14px}
/* judgement card */
.card{margin-top:10px;background:var(--ink);color:#F8F8F4;border-radius:18px;padding:16px 18px;max-width:520px}
.card .lab{font:400 11px/16px "Geist Mono","Noto Sans JP";color:#B9B8B1}
.card .q{font-size:16px;font-weight:500;margin-top:6px}
.card .d{font-size:13px;color:#D8D7D0;margin-top:4px}
.card .rw{display:flex;align-items:center;gap:10px;margin-top:14px}
.card .go{height:36px;padding:0 20px;border-radius:18px;background:#F8F8F4;color:var(--ink);font-weight:600;font-size:14px}
.card .fx{height:36px;padding:0 16px;border-radius:18px;box-shadow:inset 0 0 0 1px #6B6A64;color:#F8F8F4;font-size:14px}
.card .lock{margin-left:auto;font:400 11px/16px "Geist Mono","Noto Sans JP";color:#B9B8B1}
.done{margin-top:10px;font-size:13px;color:var(--sub);display:flex;gap:8px}.done:before{content:"✓";color:var(--acc);font-weight:600}
/* today */
.sec{background:var(--well);border-radius:20px;padding:6px}
.sh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;font-weight:500;font-size:14px}
.sh .n{font:600 11px/18px "Geist Mono";background:var(--ink);color:#fff;border-radius:9px;padding:0 7px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;width:100%;text-align:left}
.li:hover,.li.focus{background:#E3E5FF}
.li .tx{flex:1;min-width:0}
.li .tp{font-size:14px;line-height:20px;color:var(--ink)}
.li .mt{font:400 11px/16px "Geist Mono","Noto Sans JP";color:var(--mute)}
.li .go{font-size:12px;color:var(--acc);font-weight:500}
.mail .ad{font:400 13px "Geist Mono",monospace;color:#F8F7F4;margin-left:6px}.sec.emp .sh{padding:10px 12px}.sec.emp .sh .n{font-weight:400;color:var(--mute)}.sec .ref{padding:2px 12px 10px 56px;font-size:12px;color:#66635B}.card .rw button{white-space:nowrap;flex:none}.mail .dl{color:#C3C8FF;text-decoration:underline;text-underline-offset:3px}.empty{padding:8px 12px 12px;font-size:13px;color:var(--mute)}
/* pane */
.pn{display:flex;flex-direction:column;overflow:hidden}
.pn .hd{display:flex;align-items:center;gap:10px}
.pn .hd h2{font-size:16px;font-weight:500}
.pn .x{margin-left:auto;font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.pn .bd{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;margin-top:16px}
.src{font-size:12px;color:var(--mute);background:var(--well);border-radius:12px;padding:8px 12px}
.ring{display:flex;gap:4px;margin-top:6px}.ring i{flex:1;height:4px;border-radius:2px;background:#D9D9D2}.ring i.on{background:var(--acc)}
.lg{font:400 12px/20px "Geist Mono","Noto Sans JP";color:var(--sub);display:flex;gap:10px}.lg span:first-child{color:var(--mute);width:40px;flex:none}
.res{background:var(--well);border-radius:14px;padding:12px 14px;font-size:13px}
.res li{margin-left:18px}
.ex{position:fixed;right:28px;bottom:10px;font:400 11px/16px "Geist Mono","Noto Sans JP";color:var(--mute)}

.it .cnt{margin-left:auto;font:500 11px/16px "Geist Mono";color:var(--acc)}
.sh .n{font:500 13px/18px "Geist Mono";background:none;color:var(--ink);padding:0}
.li{min-height:56px}
.li.jd{position:relative}.li.jd:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--ink);border-radius:0}
.li .mt{font-size:12px}
.m{position:relative}
.m:hover .menu{display:flex}
.menu{display:none;position:absolute;right:6px;top:-14px;background:var(--tile);box-shadow:var(--sh);border-radius:10px;padding:3px;gap:2px;z-index:2}
.menu span{font-size:12px;color:var(--sub);padding:2px 8px;border-radius:7px}.menu span:hover{background:var(--well)}
.m.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%,60%{background:var(--accw)}100%{background:transparent}}
.m.rng{box-shadow:inset 3px 0 0 var(--acc)}
.rr{font:400 12px/16px "Geist Mono","Noto Sans JP";color:var(--acc);margin:2px 0 4px;display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:3px}
.thl{height:28px;padding:0 12px}
.dec{box-shadow:none;padding:0;font:400 12px/16px "Geist Mono","Noto Sans JP";color:var(--ink)}
.dec:before{content:"◆";font-size:10px}
.ho .un{font:500 11px/16px "Geist Mono";color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);border-radius:6px;padding:0 6px}
.ho .rcv{height:28px;padding:0 12px;border-radius:14px;background:var(--ink);color:#F8F8F4;font-size:12px;font-weight:600}
.me-only{background:#E7E5E0;border-radius:14px;padding:10px 12px;margin:-4px -8px}
.me-only .lb{font:500 11px/16px "Geist Mono","Noto Sans JP";color:var(--sub);margin-bottom:4px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;background:#1E2023;border-radius:12px;padding:10px 12px;color:#F8F8F4}
.opt:hover{background:#2A2C2F}
.opt b{font-weight:600;font-size:14px}.opt .why{font-size:12px;color:#D8D7D0;display:block;margin-top:2px}
.opt .src2{font:400 11px/16px "Geist Mono","Noto Sans JP";color:#B9B8B1;text-decoration:underline}
.mail{background:#1E2023;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;color:#E6E5DF;line-height:21px}
.mail .h{font:400 11px/16px "Geist Mono","Noto Sans JP";color:#B9B8B1}
.focus{max-width:720px;margin:0 auto 8px;font-size:13px;color:var(--ink);display:flex;gap:8px;align-items:center}.focus:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute)}
.tcomp{margin-top:12px;display:flex;gap:8px}
.tcomp input{flex:1;height:44px;border:0;border-radius:14px;background:var(--well);padding:0 14px;font:inherit;font-size:14px;color:var(--ink);outline:none}
.tcomp input:focus{box-shadow:inset 0 0 0 1.5px var(--acc)}
.endday{text-align:center;color:var(--sub);font-size:14px;padding:40px 0}
.hop{font-size:13px;color:var(--sub);margin-top:4px;display:flex;gap:8px;align-items:center}.hop b{color:var(--ink);font-family:"Geist Mono"}
.mk{height:28px;padding:0 12px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--ink);font-size:12px;font-weight:600;color:var(--ink)}
.ho{align-items:flex-start}.mail{background:none;padding:0}.mail .h{font-size:12px;color:#D8D7D0;margin-top:2px}
.mb2{background:#F8F7F4;color:#141416;font-size:13px;line-height:22px;border-radius:12px;padding:12px 14px;margin-top:8px}
.ref{font-size:12px;color:var(--sub);padding:0 18px;display:flex;gap:10px;align-items:center;font-family:"Geist Mono","Noto Sans JP"}
</style><style id="dark">
html{color-scheme:dark;scrollbar-color:#3A3A40 transparent}

:root{--bg:#121214;--tile:#1C1C1F;--well:#26262A;--ink:#EDEBE6;--sub:#A3A098;--mute:#A3A098;--acc:#8F96FF;--accf:#2B36FF;--accw:#23285C;--line:#2E2E33;--sh:none}
.t{box-shadow:none;border:1px solid var(--line)}
.top{border-bottom-color:var(--line)}

.av{background:#3A3A40;color:var(--ink);border-radius:50%}.av.ai{border-radius:12px;color:#fff}

.opt .why,.opt .src2{color:var(--sub)}

.menu{box-shadow:none;border:1px solid var(--line);background:var(--well)}
/* 社外送信：ダーク版で唯一の明るい面 */
.card{background:#F8F7F4;color:#141416}
.card .lab,.card .lock,.card .d{color:#66635B}
.card .go{background:#141416;color:#fff}
.card .fx{box-shadow:inset 0 0 0 1px #141416;color:#141416}

</style></head><body><div id="app"></div>
<div class="ex">会社・人物・時刻・見積もりはすべて架空の例です</div>
<script>const P={濱田:'濱',田中:'田',佐藤:'佐'},A={ユイ:'ユ',リク:'リ',ハル:'ハ'};
const S=[
 {t:'8:30',me:'濱田',ttl:'朝の入口',v:'today',stg:0},
 {t:'9:20〜9:40',me:'田中',ttl:'人同士の相談からリクを呼ぶ',v:'case',stg:1},
 {t:'11:00',me:'佐藤',ttl:'スレッドで調査結果と修正案',v:'case',stg:2},
 {t:'15:00',me:'濱田',ttl:'引き継ぎと方針の判断',v:'case',stg:3},
 {t:'15:15',me:'濱田',ttl:'顧客宛てメールを確認して送る',v:'case',stg:4},
 {t:'翌朝 9:10',me:'佐藤',ttl:'決まったことから再開',v:'today',stg:5},
 {t:'翌朝 9:30',me:'田中',ttl:'残っている顧客連絡',v:'today',stg:6,nt:'この場面の説明：夜のあいだの作業完了では通知を鳴らさず、次にすることを「今日」に残しています。'},
];
const U=new URLSearchParams(location.search);
let st={s:+(U.get('s')||0),pane:U.get('pane'),alt:U.get('v'),jump:null,draft:'修正案1で進めます。テストは',tsc:0,rcv:false,dec:false,sent:false,hl:null,rng:false};
if(st.s>=4||U.get('rcv'))st.rcv=true; if(st.s>=5)st.sent=true; if(st.s>=4)st.dec=true;
const sc=()=>S[st.s];
const me=()=>st.jump?st.jump.me:sc().me;
const stg=()=>st.jump?st.jump.stg:sc().stg;
const av=n=>A[n]?`<div class="av ai">${A[n]}</div>`:`<div class="av">${P[n]}</div>`;
const nm=(n,t)=>`<div class="nm"><b>${n}</b>${A[n]?'<span class="tag">AI</span>':''}${t}</div>`;
const menu=n=>A[n]?`<div class="menu"><span>ここから読んで</span></div>`:`<div class="menu">${n===me()?'<span>決定にする</span>':''}<span>返信</span></div>`;
const msg=(id,n,t,body,cls='')=>`<div class="m ${cls}" data-id="${id}">${av(n)}<div style="flex:1;min-width:0">${nm(n,t)}<div>${body}</div></div>${menu(n)}</div>`;
const rx=t=>`<div class="rx" style="margin:-12px 0 0 46px"><span class="pill">${t}</span></div>`;
const dec=(w,t)=>`<div style="margin:-12px 0 0 46px"><span class="dec">決定 · ${w} ${t}</span></div>`;
/* ---------- rail ---------- */
function todayCount(){const m=me(),g=stg();
 if(m==='濱田')return g===0?3:g===3?(st.dec?0:1):g===4?(st.sent?0:1):1;
 if(m==='佐藤')return g===5?1:0; if(m==='田中')return g===6?1:0; return 0;}
function rail(){
 const m=me(),g=stg(),c=todayCount(),v=st.alt||(st.jump?'case':sc().v);
 const rik=g===1?['作業中','w']:g===5?['待機中','']:['待機中',''],hal=g===4&&!st.sent?['判断待ち','n']:['待機中',''];
 const ai=(n,s)=>`<div class="it"><span class="mini ai">${A[n]}</span>${n}<span class="sl ${s[1]}">${s[0]}</span></div>`;
 const people=Object.keys(P).filter(n=>n!==m).map(n=>`<button class="it ${v==='dm'&&st.dmw===n?'on':''}" data-dm="${n}"><span class="mini">${P[n]}</span>${n}<span class="sl">${n==='佐藤'&&g===3?'16時まで集中':''}</span></button>`).join('');
 return `<div class="t rail"><div class="org">株式会社サンプル開発</div><div class="who">${m}として表示・${st.jump?st.jump.t:sc().t}</div>
 <button class="it ${v==='today'?'on':''}" data-today="1">今日</button>
 <div class="grp">チャンネル</div><div class="it"># 案件A</div>
 <button class="it ${v==='case'?'on':'b'}" data-case="1"># 案件B</button>
 <div class="it"># 全体</div><button class="it ${v==='chat'?'on':'b'}" data-alt="chat"># 雑談</button>
 <div class="grp">DM・人</div>${people}
 <div class="grp">DM・AI社員</div>${ai('ユイ',['待機中',''])}${ai('リク',rik)}${ai('ハル',hal)}
 <div class="ctl"><div class="sc">場面 ${st.s+1}/${S.length}・${sc().t}<b>${sc().ttl}</b></div>
 <div class="row"><button class="cb" id="pv" ${st.s?'':'disabled'}>前へ</button><button class="cb p" id="nx" ${st.s<S.length-1?'':'disabled'}>次へ</button></div>
 ${sc().nt?`<div class="note">${sc().nt}</div>`:''}<div class="note">台本の1本の流れだけを再現しています。検索・通知・送信は見た目だけで、実際には動きません。</div></div></div>`;
}
const hdr=(h,mem)=>`<div class="top"><h1>${h}</h1><span class="mem">${mem}</span><div class="srch">⌕ 会話と作業記録を検索<span class="k">⌘K</span></div></div>`;
/* ---------- today ---------- */
const li=(who,meta,tp,go,jd)=>`<button class="li ${jd?'jd':''}" data-go='${JSON.stringify(go)}'>${av(who)}<div class="tx"><div class="mt">${meta}</div><div class="tp">${tp}</div></div></button>`;
const sec=(t,rows,x='')=>rows.length?`<div class="sec"><div class="sh">${t}<span class="n">${rows.length}</span></div>${rows.join('')}${x}</div>`:`<div class="sec emp"><div class="sh">${t}<span class="n">なし</span></div></div>`;
function today(){
 const m=me(),g=stg();
 if(m==='佐藤'&&g===5) return hdr('今日','佐藤さん宛て・昨日16:00から')+`<div class="body"><div class="col">
 ${sec('あなたへの相談',[li('リク','# 案件B · 2:10','CSV出力の実装が終わりました。レビューをお願いします',{stg:5,me:'佐藤',hl:'r9',t:'翌朝 9:10'})])}

/* ---------- render ---------- */
function render(){
 const tb=document.getElementById('tb');if(tb)st.tsc=tb.scrollTop;
 let main,v=st.alt||(st.jump?'case':sc().v);
 main=v==='chat'?chat():v==='dm'?dm():v==='today'?today():caseB();
 const showPane=v==='case'&&st.pane&&stg()>=1;
 document.getElementById('app').innerHTML=`<div class="app ${showPane?'pane':''}">${rail()}<div class="t main">${main}</div>${showPane?pane():''}</div>`;
 const q=(x,f)=>document.querySelectorAll(x).forEach(e=>e.onclick=f);
 const go=i=>{st.s=i;st.alt=null;st.jump=null;st.hl=null;st.rng=false;const g=S[i].stg;st.pane=(g===1||g===2)?'thread':null;st.rcv=g>=3&&i>3;st.dec=i>=4;st.sent=i>=5;render();};
 q('#nx',()=>go(st.s+1));q('#pv',()=>go(st.s-1));
 q('[data-pane]',e=>{e.stopPropagation();st.pane=e.currentTarget.dataset.pane||null;render()});
 q('[data-alt]',e=>{st.alt=e.currentTarget.dataset.alt;render()});
 q('[data-dm]',e=>{st.alt='dm';st.dmw=e.currentTarget.dataset.dm;render()});

 q('[data-case]',()=>{st.alt=null;if(sc().v==='today'&&!st.jump)st.jump={stg:sc().stg,me:sc().me,t:sc().t};render()});
 q('#send',()=>{st.sent=true;render()});
 q('#rcv',()=>{st.rcv=true;render()});
 q('#mk',()=>{st.dec=true;st.hl='h3';render()});
 q('[data-rng]',()=>{st.rng=!st.rng;render()});
 q('[data-go]',e=>{const d=JSON.parse(e.currentTarget.dataset.go);if(!d)return;st.alt=null;st.jump=d;st.pane=d.pane||null;st.hl=d.hl;st.back=d.back||0;render()});
 q('[data-hl]',e=>{e.preventDefault();e.stopPropagation();st.hl=e.currentTarget.dataset.hl;st.back=0;flash()});
 const d=document.getElementById('draft');if(d)d.oninput=()=>{st.draft=d.value};

 if(st.hl)flash(); else if(stg()===4&&!st.alt){setTimeout(()=>{const b=document.getElementById('mb');if(b)b.scrollTop=b.scrollHeight;},300);} else {const u=document.querySelector('#mb .unread');if(u)u.scrollIntoView({block:'start'});}
}
function flash(){
 const all=[...document.querySelectorAll('[data-id]')];const i=all.findIndex(x=>x.dataset.id===st.hl);if(i<0)return;
 const el=all[i];(all[Math.max(0,i-(st.back||0))]).scrollIntoView({block:'start'});
 el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');st.hl=null;
}
if((sc().stg===1||sc().stg===2)&&st.pane==null)st.pane='thread';
render();
