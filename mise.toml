#:schema https://mise.jdx.dev/schema/mise.json
# Pelway のローカル開発環境（mise 管理分）。
# 方針・手順: docs/dev-environment.md
# グローバル設定（mise use -g）は使わない。このファイルがプロジェクトの単一のバージョン管理元。

# mr_boxington オプション（cargo を mbx 経由にする）には mise 2026.9.2 以上が必要。
# それ未満の mise はエラーで停止する（ハード最小値）。
min_version = "2026.9.2"

[settings]
# このプロジェクトで mise.lock を生成・使用する（ユーザーのグローバル設定に依存しない）。
lockfile = true

[tools]
# rust は mise 経由で rustup のツールチェーンを固定する。
# mr_boxington = true で cargo を mbx（Cargo ビルド共有キャッシュ）経由にする。
# components で rustfmt・clippy に加え CI のカバレッジ計測（cargo-llvm-cov）が
# 必要とする llvm-tools-preview を明示し、最小構成のツールチェーンでも
# fmt・lint・coverage が再現されるようにする（toolchain-check タスクが存在検査する）。
rust = { version = "1.96.0", mr_boxington = true, components = ["rustfmt", "clippy", "llvm-tools-preview"] }
mr-boxington = "1.29.2"
hk = "2.11.1"
fnox = "1.47.0"
pitchfork = "2.33.1"
# スペルチェッカ（typos）。git hook（hk.pkl の Builtins.typos ステップ）と
# hk check --all（verify タスク・CI）で実行する。担当が公式リリースを確認の上でピン。
# 出典: https://github.com/crate-ci/typos/releases/tag/v1.52.0
typos = "1.52.0"
# CI（GitHub Actions）の workflow 静的 lint。担当が公式リリースを確認の上でピン。
# 出典: https://github.com/jdx/jactionlint/releases/latest （v2.5.0）
jactionlint = "2.5.0"
# CI のカバレッジ増減表示（octocov）。担当が公式リリースを確認の上でピン。
# 出典: https://github.com/k1LoW/octocov/releases/tag/v0.83.5
# 短縮名 octocov は mise レジストリに無い（tool not found）。octocov 向けの packslip
# バックエンドも無いため、mise.lock に URL と checksum が残る aqua バックエンドで宣言する。
"aqua:k1LoW/octocov" = "0.83.5"
# CI のカバレッジ計測（cargo-llvm-cov）。ソースからのビルドは 45 秒ほどかかるため、
# 公式配布の事前ビルド済みバイナリを aqua バックエンドで導入する（octocov と同じ
# 経路。mise.lock が URL と checksum で取得物を固定する）。crates.io の同名
# パッケージを cargo install するとソースビルドになるため使わない。
# 出典: https://github.com/taiki-e/cargo-llvm-cov/releases/tag/v0.6.17
"aqua:taiki-e/cargo-llvm-cov" = "0.6.17"

# コンテナ実行環境（非 Docker・要件は docs/dev-environment.md）。
# rootless Podman 一式を apt から導入する宣言。適用は明示的な bootstrap 実行時だけ
# （日常の mise install / mise run では発動しない）。
# root でない実行では sudo を使うため、対話的なパスワード入力で実施する:
#   mise bootstrap packages apply --manager apt --dry-run   # 予定確認
#   mise bootstrap packages apply --manager apt             # 適用
[bootstrap.packages]
"apt:podman" = "latest"

[env]
# 秘密を含む環境変数は mise に置かず fnox で管理する（fnox.toml 参照）。
# ここには秘密にならない既定値だけを置く。
CARGO_TERM_COLOR = "auto"
PELWAY_BIND_ADDR = "127.0.0.1:0"
# crates.io の取得失敗を減らすための cargo の設定（ローカル・CI の両方）。
# CARGO_HTTP_MULTIPLEXING=false: HTTP/2 の多重化で起きる
# 「Error in the HTTP2 framing layer」で crates.io の取得が失敗する既知の不具合を避ける。
# CARGO_NET_RETRY=10: 一時的な失敗（ネットワーク・レジストリ障害）の再試行回数を増やす
# （既定は 2）。
CARGO_HTTP_MULTIPLEXING = "false"
CARGO_NET_RETRY = "10"

# ---- 日常タスク（mise run <タスク名>） ----

[tasks.fmt]
description = "rustfmt で全コードを整形する"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "整形済みかの検査のみ（書き換えない）"
run = "cargo fmt --all --check"

[tasks.check]
description = "cargo check（--locked で Cargo.lock を強制）"
run = "cargo check --workspace --all-targets --locked"

[tasks.clippy]
description = "clippy を -D warnings（警告即エラー）で実行する（--locked）"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "全テストを実行する（--locked）"
run = "cargo test --workspace --locked"

[tasks.build]
description = "デバッグビルドを作る（--locked）"
run = "cargo build --workspace --locked"

[tasks.fetch]
description = "依存クレートを取得する（--locked で Cargo.lock を強制）。ビルド前に明示的に取得し、一時的な取得失敗をビルドを中断した状態で残さない"
run = "cargo fetch --locked"

[tasks.toolchain-check]
description = "rustfmt・cargo-clippy・llvm-tools-preview 成分の存在確認（欠けていれば失敗し、暗黙の自動ダウンロードには頼らない）"
run = """
rustc --version
cargo --version
rustfmt --version
cargo clippy --version
sysroot=$(rustc --print sysroot)
host=$(rustc -vV | awk '/^host:/{print $2}')
profdata="$sysroot/lib/rustlib/$host/bin/llvm-profdata"
cov="$sysroot/lib/rustlib/$host/bin/llvm-cov"
if [ ! -x "$profdata" ] || [ ! -x "$cov" ]; then
  echo "llvm-tools-preview is missing from the project toolchain (expected $profdata and $cov). Declare it in mise.toml rust.components and run mise install --locked. Do not rely on implicit rustup auto-download." >&2
  exit 1
fi
"$profdata" --version
"$cov" --version
"""

[tasks.hk-validate]
description = "hk.pkl の構文検証"
run = "hk validate"

[tasks.hk-check]
description = "hk でリポジトリ全体を検査（読み取り専用・cargo を伴うステップは除く）"
# hk.pkl には cargo_fmt / cargo_clippy / cargo_check のステップもあるが、同じ検査が
# fmt-check / clippy タスクで走っており、hk 側でも走らせると依存クレートを
# 二重にコンパイルすることになる（CI ではジョブ分割のため target が別になり、
# 二重コンパイルがそのまま時間になる）。そのため hk は cargo を伴わない
# ステップ（typos / trailing_whitespace / newlines）だけ走らせる。
# cargo を伴う検査は mise の fmt-check / clippy タスクが担当する。
# hk.pkl の cargo ステップは git hook（pre-commit）用に残す。
run = "hk check --all --step typos --step trailing_whitespace --step newlines"

[tasks.fnox-check]
description = "fnox の定義一覧を確認（秘密値の取得・表示は行わない）"
run = "fnox list"

[tasks.pitchfork-check]
description = "pitchfork のバージョン確認と、pitchfork.toml に見張り役 agent-watch が定義されていることの確認"
run = """
pitchfork --version
if ! grep -q '^\\[daemons.agent-watch\\]' pitchfork.toml 2>/dev/null; then
  echo "pitchfork.toml に [daemons.agent-watch] がありません（docs/dev-environment.md 参照）" >&2
  exit 1
fi
"""

[tasks.pr-size]
description = "PR の差分行数を数え、800 行を超えたら失敗する（linguist-generated とバイナリは除く）"
run = "bash scripts/pr-size.sh"

[tasks.script-test]
description = "scripts/ のシェルスクリプトのテスト"
run = "bash scripts/tests/pr-size.test.sh && bash scripts/tests/agent-gh.test.sh && bash scripts/tests/agent-worktree-prune.test.sh"

[tasks.agent-worktree-prune]
description = "T3 が作った worktree のうち、PR がマージ済み・クローズ済みのものを確認してから消す（--dry-run で一覧だけ）"
run = "bash scripts/agent-worktree-prune"

[tasks.codex-review-check]
description = "レビュー担当の Codex（codex_review）のネットワークが GitHub だけに絞られているかを確かめる（Codex を更新したら実行する）"
run = """
#!/usr/bin/env bash
set -uo pipefail
probe() { codex sandbox --enable network_proxy -P review -- curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$@" 2>/dev/null; }
ok=1
for u in https://api.github.com https://github.com; do
  code="$(probe "$u")"; echo "$u -> $code"; [[ "$code" == 200 ]] || ok=0
done
for u in https://example.com; do
  code="$(probe "$u")"; echo "$u -> ${code:-000}"; [[ "$code" == 000 || -z "$code" ]] || ok=0
  code="$(probe --noproxy '*' "$u")"; echo "$u (noproxy) -> ${code:-000}"; [[ "$code" == 000 || -z "$code" ]] || ok=0
done
((ok)) && echo "codex-review-check: ok" || { echo "codex-review-check: NG（~/.codex/config.toml の [permissions.review] と features を確かめる）"; exit 1; }
"""

[tasks.agent-watch-install]
description = "見張り役 pelway-agent-watch を ~/.local/bin にインストールする（pitchfork の agent-watch が動かすバイナリ）"
run = "cargo install --path crates/pelway-agent-watch --locked --root ~/.local --force"

[tasks.verify]
description = "開発環境の一括確認（依存タスクは並列実行）"
# 検査は 3 つのグループに分ける。CI でも同じグループを 1 ジョブずつ走らせる
# （docs/dev-environment.md「CI（GitHub Actions）」を参照）。分け方の 이유는
# cargo でコンパイルするグループを 2 つに絞って、依存クレートの二重コンパイル
# を避けること。check は clippy に含まれ、build は test が同じ成果物を作るため
# verify には含めない（check / build タスク自体は残す）。
depends = ["verify-lint", "verify-test", "verify-static"]

# cargo fmt / clippy と、ツールチェーン・hk.pkl の構文を確かめる。
[tasks.verify-lint]
description = "整形・clippy・ツールチェーンの検査"
depends = ["fmt-check", "clippy", "toolchain-check", "hk-validate"]

# テストと、スクリプトのテスト。
[tasks.verify-test]
description = "テストとスクリプトのテスト"
depends = ["test", "script-test"]

# cargo を伴わない検査（cargo は verify-lint / verify-test が担当する）。
[tasks.verify-static]
description = "cargo を伴わない検査（hk / fnox / pitchfork）"
depends = ["hk-check", "fnox-check", "pitchfork-check"]

# `mise bootstrap` は packages（apt:podman・sudo）→ tools（mise install 相当）→ このタスクの順で実行する。
# これにより mise trust 後の mise bootstrap 1回で環境構築が完了する。
# このタスクは mise bootstrap のたびに実行されるが、hk install と verify はともに冪等。
[tasks.bootstrap]
description = "mise bootstrap の最後に自動実行: hk フックの導入と環境の一括確認"
run = [
  "hk install --mise",
  "mise run verify",
]
