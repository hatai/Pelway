# octocov の設定（k1LoW/octocov）。
# 実行は .github/workflows/verify.yml の coverage ジョブから（PR コメントで増減を表示）。
# 比較用レポートの保存先は GitHub Actions の artifact に限る（S3・GitHub Actions cache は使わない）。

coverage:
  paths:
    - lcov.info

# 公式 v0.83.5 の comment: で PR にカバレッジ報告を投稿する。
# https://github.com/k1LoW/octocov/blob/v0.83.5/README.md
# body:（PR 本文への挿入）は使わない。同じコメントを更新する。
comment:
  if: is_pull_request
  updatePrevious: true

diff:
  storage:
    artifacts:
      # base 側（main や前回 run）の artifact がまだ無い場合は増減なしとして続行する。
      if-no-artifact: pass
