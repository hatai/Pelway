# octocov の設定（k1LoW/octocov）。
# 実行は .github/workflows/verify.yml の coverage ジョブから（PR コメントで増減を表示）。
# レポート（自側・比較用）の保存先は GitHub Actions の artifact に限る（S3・GitHub Actions cache は使わない）。

coverage:
  paths:
    - lcov.info

# 公式 v0.83.5 の comment: で PR にカバレッジ報告を投稿する。
# https://github.com/k1LoW/octocov/blob/v0.83.5/README.md
# body:（PR 本文への挿入）は使わない。同じコメントを更新する。
comment:
  if: is_pull_request
  updatePrevious: true

# 公式 v0.83.5 の datastores による保存と比較（README「Comment report to pull request」の例と同じ形。
# diff.storage は v0.83.5 の README に存在しない書き方のため使わない）。
# report: がこの run のレポートを artifact に保存し、diff: が base ブランチ（main）のレポートを読む。
# main 側のレポートは main での run でしか保存されないため、増減は main でレポートが保存された
# あとの PR から出る。比較相手が無いことでは run は落ちないが、保存（report.datastores）の失敗は
# run を落とす（README「Exit status」）。
report:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
