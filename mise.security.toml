#:schema https://mise.jdx.dev/schema/mise.json
# security-scan workflow（.github/workflows/security-scan.yml、Issue #571）が使う CLI。
# MISE_ENV=security のときだけ mise.toml に重ねて読まれ、mise.security.lock が URL と checksum で
# 取得物を固定する。必須チェックの verify ジョブ（MISE_ENV なし）には影響しない。
# Semgrep は PyPI 配布で、依存の固定（uv.lock）が 1800 行を超えるため mise では入れず、
# workflow で公式イメージを digest 固定して使う（docs/dev-environment.md の「セキュリティスキャン」）。

[tools]
# 秘密情報の検出。CLI 本体は MIT。gitleaks-action（v2 以降は独自 EULA）は使わない。
# 出典: https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
"aqua:gitleaks/gitleaks" = "8.30.1"
# 脆弱な依存関係の検出（OSV データベース）。Apache-2.0。
# 出典: https://github.com/google/osv-scanner/releases/tag/v2.7.1
"aqua:google/osv-scanner" = "2.7.1"
