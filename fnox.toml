#:schema https://fnox.jdx.dev/schema.json
# Pelway のシークレット定義。
# このファイルにはシークレットの「名前」と、秘密を含まないローカル開発用の
# 既定テンプレートだけを置く。実際の秘密値（value）を書かないこと。
# 本物の値は各自が fnox set で暗号化して登録する。運用手順は docs/dev-environment.md。

# このディレクトリで設定探索を止め、親ディレクトリの設定を誤って継承しない。
root = true

# 既定は fail-closed: 値を解決できないシークレットがあればコマンドをエラーで止める。
# 値の登録を当分必須にしないものだけ、個別に if_missing = "ignore" を指定する。
if_missing = "error"

[secrets]
# --- ローカル開発の既定値（秘密を含まないテンプレート） ---

# 接続文字列には将来パスワード等の秘密を含めうるため、非秘密でも fnox 側で管理する。
# 既定値は loopback・パスワードなし。実運用の値は各自が設定する。
PELWAY_DATABASE_URL = { default = "postgres://pelway@127.0.0.1:5432/pelway", description = "ローカル開発用のPostgreSQL接続先（loopback・パスワードなしの既定値）" }

# --- 将来必要になる秘密の名前だけの宣言（値なし・当面未使用のため個別に ignore） ---

PELWAY_LLM_API_KEY = { if_missing = "ignore", description = "LLMゲートウェイのAPI鍵。実装が進んだ時点で各自が設定する。現時点では未使用" }

# --- AI 開発チームの GitHub 名義（scripts/agent-gh が使う。docs/superpowers/specs/agent-team.md） ---
# 登録手順は scripts/setup/agent-accounts.sh。未登録の環境では agent-gh が終了コード 3 で止まる。

PELWAY_AGENT_GH_TOKEN = { if_missing = "ignore", description = "実装担当のマシンユーザー pelway-agent の PAT" }
PELWAY_AGENT_GIT_EMAIL = { if_missing = "ignore", description = "pelway-agent のコミット用メールアドレス（<id>+pelway-agent@users.noreply.github.com）。秘密ではないが置き場所をそろえる" }
PELWAY_REVIEW_APP_ID = { if_missing = "ignore", description = "レビュー担当の GitHub App pelway-review の App ID" }
PELWAY_REVIEW_APP_INSTALLATION_ID = { if_missing = "ignore", description = "pelway-review を hatai/Pelway に入れたときの Installation ID" }
PELWAY_REVIEW_APP_KEY = { if_missing = "ignore", description = "pelway-review の秘密鍵（PEM）" }
