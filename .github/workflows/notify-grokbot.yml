# GitHub の出来事を Grok Bot の webhook に通知する（platform-gh-notify-r1）。
# - 送るのはメタデータだけ（13 キー固定）。PR タイトル・本文、コメント本文、
#   レビュー本文、ラベル、メールアドレス等は送らない
# - checkout も GitHub API も使わないため permissions は空（{}）
# - Secret は GROKBOT_WEBHOOK_URL（URL）/ GROKBOT_WEBHOOK_AUTH（Authorization
#   ヘッダーの値全体）。登録手順は docs/dev-environment.md の
#   「GitHub 通知（Grok Bot webhook・notify-grokbot）」
# - URL・鍵は curl の引数とエラー出力に出さない（--config - で標準入力から渡す）

name: notify-grokbot

on:
  pull_request:
    types:
      - opened
      - reopened
      - closed
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created
  # 誰でもコメントで発火できる trigger。ジョブ側で PR 由来（issue.pull_request
  # の存在）だけに絞り、permissions は空・checkout なし・PR コードの実行なしで
  # 対処するため抑制する。
  issue_comment: # jactionlint ignore=dangerous-triggers
    types:
      - created
  # fork 由来の run を扱い得る trigger。gate step で head リポジトリの full_name
  # がこのリポジトリと一致するときだけ送り、fork はスキップ。artifact の
  # ダウンロード・PR コードの実行はないため抑制する。
  workflow_run: # jactionlint ignore=dangerous-triggers
    # .github/workflows/verify.yml の name:（workflow 名）と正確に一致させる。
    workflows:
      - verify
    types:
      - completed
  workflow_dispatch:

# イベント payload の読み取りと outbound POST だけなので権限は不要。
permissions: {}

# 通知は出来事ごとに 1 通ずつ届けるべきものなので cancel-in-progress は
# 使わない（true だと短時間に続いたイベントの古い通知が逸失する）。
# 同一PR / 同一対象 run の通知だけ直列に並べる。
concurrency:
  group: notify-grokbot-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    name: notify-grokbot
    # issue_comment は通常の issue でも発火する。PR に付いたコメント
    # （github.event.issue.pull_request がある）だけを対象にし、
    # それ以外はジョブごと skip する。
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # 送る・送らないの判断。Secret 未設定・fork 由来のイベントは
      # 通知せずにこのジョブを成功で終える（CI を落とさない）。
      # ジョブ全体の if ではなく step で判定するのは、skip ではなく
      # 「成功」で終わらせるため。
      - name: Decide whether to notify
        id: gate
        env:
          # head commit が属するリポジトリ（fork だと GITHUB_REPOSITORY と違う）。
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.GROKBOT_WEBHOOK_AUTH }}
        run: |
          set -eu
          skip_reason=""
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_AUTH" ]; then
            skip_reason="GROKBOT_WEBHOOK_URL / GROKBOT_WEBHOOK_AUTH secrets are not configured"
          else
            case "$GITHUB_EVENT_NAME" in
              pull_request|pull_request_review|pull_request_review_comment|workflow_run)
                if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
                  skip_reason="event comes from fork repository $HEAD_REPO"
                fi
                ;;
            esac
          fi
          if [ -n "$skip_reason" ]; then
            echo "::notice::Skipping Grok Bot notification: $skip_reason."
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi

      # メタデータだけの JSON を組み立てて POST する。
      # ${{ }} は run: に直接書かず、必要な値はすべてこの step の env: 経由で渡す。
      # 数値（pr_number）と真偽値（merged）は --argjson、値が空なら null。
      - name: Send notification
        if: steps.gate.outputs.should_send == 'true'
        env:
          REPO: ${{ github.repository }}
          # 手動実行（workflow_dispatch）は event: "test" のテスト通知を送る。
          EVENT: ${{ github.event_name == 'workflow_dispatch' && 'test' || github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          # workflow_run のときは対象 run の html_url。それ以外は空になり、
          # run: 側で自分の run の URL（$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID）に落ちる。
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ACTOR: ${{ github.actor }}
          WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.GROKBOT_WEBHOOK_AUTH }}
        run: |
          set -eu

          payload="$(jq -n \
            --arg schema "pelway.github-notify/v1" \
            --arg repo "$REPO" \
            --arg event "$EVENT" \
            --arg action "${ACTION:-}" \
            --argjson pr_number "${PR_NUMBER:-null}" \
            --arg head_branch "${HEAD_BRANCH:-}" \
            --arg head_sha "${HEAD_SHA:-}" \
            --argjson merged "${MERGED:-null}" \
            --arg conclusion "${CONCLUSION:-}" \
            --arg workflow_name "${WORKFLOW_NAME:-}" \
            --arg run_url "${RUN_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}" \
            --arg actor "${ACTOR:-}" \
            --arg occurred_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: $schema,
              repo: $repo,
              event: $event,
              action: (if $action == "" then null else $action end),
              pr_number: $pr_number,
              head_branch: (if $head_branch == "" then null else $head_branch end),
              head_sha: (if $head_sha == "" then null else $head_sha end),
              merged: $merged,
              conclusion: (if $conclusion == "" then null else $conclusion end),
              workflow_name: (if $workflow_name == "" then null else $workflow_name end),
              run_url: $run_url,
              actor: (if $actor == "" then null else $actor end),
              occurred_at: $occurred_at
            }')"

          # URL と Authorization の値を curl の引数・エラー出力に出さないため、
          # 両方とも標準入力の設定ファイル（--config -）で渡す（-H @- では URL が
          # 引数に残るため不採用）。設定ファイルの引用符構文に合わせて \ と " をエスケープする。
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
          curl_config="$(printf 'url = "%s"\nheader = "Authorization: %s"\n' \
            "$(esc "$WEBHOOK_URL")" "$(esc "$WEBHOOK_AUTH")")"

          # 送信失敗で CI を落とさない（|| true 相当: 以降で非 0 を返さない）。
          # ログに出すのは HTTP ステータス（と失敗時の curl 終了コード）だけ。
          set +e
          http_code="$(printf '%s\n' "$curl_config" | curl --config - \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            --max-time 10 \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' 2>/dev/null)"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "::warning::Grok Bot notification was not delivered (curl exit $curl_exit; no HTTP status)."
          else
            case "$http_code" in
              2??) echo "Grok Bot notification delivered. HTTP status: $http_code" ;;
              *) echo "::warning::Grok Bot webhook responded with HTTP status $http_code." ;;
            esac
          fi
