# GitHub の出来事を Grok Bot の webhook に通知する（platform-gh-notify-r1）。
# - 送るのは Grok Bot が動く必要のあるイベントのメタデータだけ（14 キー固定）。PR タイトル・本文、コメント本文、
#   レビュー本文、ラベル、メールアドレス等は送らない
# - checkout はしない。GitHub API は dedup（同じ PR・同じ head sha の
#   synchronize を 1 回だけにするため、送信済みの過去 run を調べる）にだけ
#   使う。permissions はそのための actions: read だけ
# - Secret は GROKBOT_WEBHOOK_URL（URL）/ GROKBOT_WEBHOOK_AUTH（Authorization
#   ヘッダーの値全体）。登録手順は docs/dev-environment.md の
#   「GitHub 通知（Grok Bot webhook・notify-grokbot）」
# - URL・鍵は curl の引数とエラー出力に出さない（--config - で標準入力から渡す）

name: notify-grokbot

on:
  # Grok Bot が動く必要のあるイベントだけ（docs/superpowers/specs/agent-team.md「GitHub からの通知」）。
  # エージェントのスレッドの状態は見張り役 agent-watch が別に送る。
  pull_request:
    # PR の作成（opened / ready_for_review）と push（synchronize）は、
    # 見張りを平日 12 時・18 時に減らした分を通知で補うため送る（#481）。
    # synchronize は digest にだけ反映し、同じ head sha では 1 回だけ送る
    # （Send step の dedup 判定を参照）。
    types:
      - opened
      - ready_for_review
      - synchronize
      - closed
  pull_request_review:
    types:
      - submitted
  # fork 由来の run を扱い得る trigger。gate step で head リポジトリの full_name
  # がこのリポジトリと一致するときだけ送り、fork はスキップ。artifact の
  # ダウンロード・PR コードの実行はないため抑制する。
  workflow_run: # jactionlint ignore=dangerous-triggers
    # .github/workflows/verify.yml と nightly.yml の name:（workflow 名）と正確に一致させる。
    workflows:
      - verify
      - nightly
    types:
      - completed
  workflow_dispatch:

# dedup が過去 run とその job を読むのに必要な最小権限（読み取りのみ）。
permissions:
  actions: read

# 実行ごとに別のグループにするので、待っている実行が新しい実行に
# 置き換えられず通知が落ちない。jactionlint の concurrency-limits を
# 満たすために置いている。group の値（github.workflow と github.run_id）は
# GitHub が決めるもので、外から中身を変えられない。
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    name: notify-grokbot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 同じ PR・同じ head sha の pull_request run を直列にして、dedup（下の
    # Check duplicate notification step）が直前の run の送信を確実に見られる
    # ようにする。待たせるだけで実行は落とさない（cancel-in-progress: false）。
    # pull_request 以外は実行ごとに別のグループ（github.run_id）にして待たせない。
    concurrency:
      group: notify-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.head.sha || github.run_id }}
      cancel-in-progress: false
    env:
      # レビュー（pull_request_review）の投稿者判定。
      # 投稿者の author_association が OWNER / MEMBER / COLLABORATOR のときだけ
      # "true"。レビュー以外のイベントでは常に "true"（投稿者判定は行わない）。
      # 判定はこの式＋Send step の if: で行い、run: には ${{ }} を書かない。
      # ボット（レビュー担当の GitHub App など）のレビューは送らない。その結果は
      # 見張り役 agent-watch がスレッドの報告行として送る。
      COMMENT_ALLOWED: >-
        ${{
          github.event_name != 'pull_request_review' ||
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
        }}
      # スキップ時の notice ログ用（公開情報のみを載せる。判定には使わない）。
      AUTHOR_ASSOC: ${{ github.event.review.author_association }}
      COMMENTER_LOGIN: ${{ github.event.review.user.login }}
    steps:
      # 送る・送らないの判断。Secret 未設定・fork 由来のイベントは
      # 通知せずにこのジョブを成功で終える（CI を落とさない）。
      # ジョブ全体の if ではなく step で判定するのは、skip ではなく
      # 「成功」で終わらせるため。
      - name: Decide whether to notify
        id: gate
        env:
          # head commit が属するリポジトリ（fork だと GITHUB_REPOSITORY と違う）。
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.GROKBOT_WEBHOOK_AUTH }}
        run: |
          set -eu
          skip_reason=""
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_AUTH" ]; then
            skip_reason="GROKBOT_WEBHOOK_URL / GROKBOT_WEBHOOK_AUTH secrets are not configured"
          else
            case "$GITHUB_EVENT_NAME" in
              pull_request|pull_request_review|workflow_run)
                if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
                  skip_reason="event comes from fork repository $HEAD_REPO"
                fi
                ;;
            esac
          fi
          if [ -n "$skip_reason" ]; then
            echo "::notice::Skipping Grok Bot notification: $skip_reason."
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi

      # レビューの投稿者が基準（OWNER / MEMBER / COLLABORATOR）を
      # 満たさないとき: 送らずに成功で終える（判定は Send step の if: と共通の
      # env で行い、ここでは理由の記録のみ）。
      - name: Note review-author skip
        if: steps.gate.outputs.should_send == 'true' && env.COMMENT_ALLOWED != 'true'
        run: |
          set -eu
          echo "::notice::Skipping Grok Bot notification: review author_association=${AUTHOR_ASSOC:-none} login=${COMMENTER_LOGIN:-unknown} is not OWNER/MEMBER/COLLABORATOR."

      # synchronize だけ、同じ PR・同じ head sha の通知がすでに送られたかを
      # この workflow の過去 run から調べる（#481 の決定: 同じ PR・同じ head sha
      # では 1 回だけ通知する）。「送った」は、Send notification step が成功した
      # run があるかで判定する。job の concurrency で同じ head の run は直列に
      # なるため、ここで見える過去 run はすべて完了済み。
      # API の呼び出しに失敗したら送る側に倒す（重複は許容し、取りこぼしはしない）。
      - name: Check duplicate notification
        id: dedup
        if: github.event.action == 'synchronize' && steps.gate.outputs.should_send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEDUP_PR: ${{ github.event.pull_request.number }}
          DEDUP_BRANCH: ${{ github.event.pull_request.head.ref }}
          DEDUP_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # jq の --arg/--argjson 変数はシングルクォート内で参照するのが正しい
          # 同じ head branch・同じ head sha の pull_request run（自分自身を除く）。
          # pull_requests が埋まっている run では PR 番号でも照合する（同じ
          # ブランチを別の PR に再利用したとき旧 PR の送信記録で抑止しないため）。
          # 空の run が多いため、空のときは branch+sha だけで照合する。
          if ! runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/notify-grokbot.yml/runs?event=pull_request&status=completed&per_page=100" 2>/dev/null \
            | jq -r --arg branch "$DEDUP_BRANCH" --arg sha "$DEDUP_SHA" --arg pr "$DEDUP_PR" --argjson self "$GITHUB_RUN_ID" \
              '[.workflow_runs[] | select(.id != $self and .head_branch == $branch and .head_sha == $sha and ((.pull_requests | length) == 0 or any(.pull_requests[]; .number == ($pr | tonumber)))) | .id] | .[]')"; then
            echo "::warning::dedup check failed (could not list workflow runs); sending notification anyway."
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          duplicate=false
          # 再実行（rerun）は同じ run id の新しい attempt で走る。status=completed の
          # 一覧には実行中の自分は載らず id でも除いているため、自分だけ別に
          # filter=all（全 attempt の job）で調べる。過去 attempt の Send notification
          # が成功していれば送信済み。現在 attempt の Send step は未実行なので
          # conclusion が null で数えられない。
          sent_own="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" 2>/dev/null \
            | jq '[.jobs[].steps[] | select(.name == "Send notification" and .conclusion == "success")] | length')" || sent_own=0
          if [ "${sent_own:-0}" -gt 0 ]; then
            duplicate=true
          fi
          while IFS= read -r run_id && [ "$duplicate" = false ]; do
            [ -n "$run_id" ] || continue
            # 候補 run も filter=all にする。再実行済みの run では最新 attempt が
            # dedup で send を skip していても、過去 attempt の送信で判定するため。
            sent="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" 2>/dev/null \
              | jq '[.jobs[].steps[] | select(.name == "Send notification" and .conclusion == "success")] | length')" || sent=0
            if [ "${sent:-0}" -gt 0 ]; then
              duplicate=true
            fi
          done <<<"$runs"
          echo "duplicate=$duplicate" >> "$GITHUB_OUTPUT"

      - name: Note duplicate-head skip
        if: github.event.action == 'synchronize' && steps.dedup.outputs.duplicate == 'true'
        env:
          DEDUP_SHA: ${{ github.event.pull_request.head.sha }}
          DEDUP_PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          echo "::notice::Skipping Grok Bot notification: head ${DEDUP_SHA:-unknown} of PR #${DEDUP_PR:-unknown} was already notified."

      # メタデータだけの JSON を組み立てて POST する。
      # ${{ }} は run: に直接書かず、必要な値はすべてこの step の env: 経由で渡す。
      # 数値（pr_number）と真偽値（merged）は --argjson、値が空なら null。
      - name: Send notification
        # dedup（Check duplicate notification step）はこの step 名で過去 run の
        # 送信を照合する。step 名を変えるときは照合側の "Send notification" も
        # 合わせる。
        # 3つのゲートを通ったときだけ送る:
        #   1) gate step: Secret あり・fork 由来ではない（should_send）
        #   2) env.COMMENT_ALLOWED: レビューは投稿者の
        #      author_association が OWNER / MEMBER / COLLABORATOR のときのみ
        #   3) dedup: synchronize では同じ head sha をすでに通知した run が
        #      あるときは送らない（synchronize 以外は常に送る）
        if: steps.gate.outputs.should_send == 'true' && env.COMMENT_ALLOWED == 'true' && !(github.event.action == 'synchronize' && steps.dedup.outputs.duplicate == 'true')
        env:
          REPO: ${{ github.repository }}
          # 手動実行（workflow_dispatch）は event: "test" のテスト通知を送る。
          EVENT: ${{ github.event_name == 'workflow_dispatch' && 'test' || github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          # workflow_run のときは対象 run の html_url。それ以外は空になり、
          # run: 側で自分の run の URL（$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID）に落ちる。
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REVIEW_STATE: ${{ github.event.review.state }}
          ACTOR: ${{ github.actor }}
          WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.GROKBOT_WEBHOOK_AUTH }}
        run: |
          set -eu

          # digest（まとめにだけ反映）: verify の成功・Approve のレビュー・
          # PR への push（synchronize）。それ以外は immediate。
          urgency="immediate"
          if { [ "$EVENT" = workflow_run ] && [ "${CONCLUSION:-}" = success ]; } \
            || { [ "$EVENT" = pull_request_review ] && [ "${REVIEW_STATE:-}" = approved ]; } \
            || { [ "$EVENT" = pull_request ] && [ "${ACTION:-}" = synchronize ]; }; then
            urgency="digest"
          fi

          payload="$(jq -n \
            --arg schema "pelway.github-notify/v2" \
            --arg urgency "$urgency" \
            --arg repo "$REPO" \
            --arg event "$EVENT" \
            --arg action "${ACTION:-}" \
            --argjson pr_number "${PR_NUMBER:-null}" \
            --arg head_branch "${HEAD_BRANCH:-}" \
            --arg head_sha "${HEAD_SHA:-}" \
            --argjson merged "${MERGED:-null}" \
            --arg conclusion "${CONCLUSION:-}" \
            --arg workflow_name "${WORKFLOW_NAME:-}" \
            --arg run_url "${RUN_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}" \
            --arg actor "${ACTOR:-}" \
            --arg occurred_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: $schema,
              urgency: $urgency,
              repo: $repo,
              event: $event,
              action: (if $action == "" then null else $action end),
              pr_number: $pr_number,
              head_branch: (if $head_branch == "" then null else $head_branch end),
              head_sha: (if $head_sha == "" then null else $head_sha end),
              merged: $merged,
              conclusion: (if $conclusion == "" then null else $conclusion end),
              workflow_name: (if $workflow_name == "" then null else $workflow_name end),
              run_url: $run_url,
              actor: (if $actor == "" then null else $actor end),
              occurred_at: $occurred_at
            }')"

          # URL と Authorization の値を curl の引数・エラー出力に出さないため、
          # 両方とも標準入力の設定ファイル（--config -）で渡す（-H @- では URL が
          # 引数に残るため不採用）。設定ファイルの引用符構文に合わせて \ と " をエスケープする。
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
          curl_config="$(printf 'url = "%s"\nheader = "Authorization: %s"\n' \
            "$(esc "$WEBHOOK_URL")" "$(esc "$WEBHOOK_AUTH")")"

          # 送信失敗で CI を落とさない（|| true 相当: 以降で非 0 を返さない）。
          # ログに出すのは HTTP ステータス（と失敗時の curl 終了コード）だけ。
          set +e
          http_code="$(printf '%s\n' "$curl_config" | curl --config - \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            --max-time 10 \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' 2>/dev/null)"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "::warning::Grok Bot notification was not delivered (curl exit $curl_exit; no HTTP status)."
          else
            case "$http_code" in
              2??) echo "Grok Bot notification delivered. HTTP status: $http_code" ;;
              *) echo "::warning::Grok Bot webhook responded with HTTP status $http_code." ;;
            esac
          fi
