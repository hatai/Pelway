[package]
# Issue #98 のクライアント技術の検証用クレート。製品機能を含まない。Slint 1.18.1 の
# ListView（可変高の仮想リストと読み上げを有効にしたときの重さ）と、Rust から
# TypeScript への型生成（ts-rs）を確かめる。測定結果は
# docs/research/slint-tauri-client-measurements.md。
name = "pelway-dev-client-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "Client technology probe for issue #98. Not a product feature."

[lib]
# WASM ビルドで cdylib として書き出すため（wasm-opt でサイズを測る）。
crate-type = ["cdylib", "rlib"]

[dependencies]
# 型生成の道具（ts-rs）と、JSON 化のための派生。
ts-rs = "12.0.1"
serde = { version = "1", features = ["derive"] }

# WASM で測るのは同期処理の土台だけなので、Slint は入れない。
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Slint は版を 1.18.1 に固定（pelway-client-ui と同じ）。既定フィーチャは外し、必要な
# ものだけを選ぶ。読み上げ（AccessKit / AT-SPI）の有無はフィーチャ `a11y` で切り替え、
# 同じソースを 2 通りでビルドして比較する（無効は `--no-default-features`）。
# compat-1-18 は slint 1.18.1 の必須。
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "renderer-femtovg",
    "compat-1-18",
] }
# スクロールイベントを送り込むための要素 API と、CPU 時間の計測。
i-slint-backend-testing = "=1.18.1"
libc = "0.2"

[features]
default = ["a11y"]
# 読み上げ（アクセシビリティ）を有効にする。
a11y = ["slint/accessibility"]

[build-dependencies]
# ui/probe.slint をコンパイルする。
slint-build = "=1.18.1"
