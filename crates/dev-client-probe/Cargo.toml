[package]
# Issue #98 のクライアント技術の検証用クレート。製品機能を含まない。Slint 1.18.1
# の ListView（可変高の仮想リストと、読み上げを有効にしたときの重さ）と、Rust から
# TypeScript への型生成（ts-rs と specta）を確かめる。測定結果は
# docs/research/slint-tauri-client-measurements.md にまとめる。
name = "pelway-dev-client-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "Client technology probe for issue #98. Not a product feature."

[lib]
# WASM ビルドで cdylib として書き出すため（wasm-opt でサイズを測る）。
crate-type = ["cdylib", "rlib"]

[dependencies]
# 型生成の道具 2 つ（specta は 2.0 の RC）。
ts-rs = "12.0.1"
specta = { version = "2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
specta-serde = "0.0.15"
serde = { version = "1", features = ["derive"] }

# WASM ビルドのときだけ入る（ホストのビルドには影響しない）。WASM で測るのは
# 同期処理の土台だけで、Slint は入めない。
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"
wasm-bindgen = "0.2"

# Slint を使うのは UI 側の検証だけなので、WASM ビルドには入れない。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Slint は版を 1.18.1 に固定（pelway-client-ui と同じ）。既定フィーチャは外し、
# 必要なものだけを選ぶ。読み上げ（AccessKit / AT-SPI）の有無はフィーチャ `a11y`
# で切り替え、同じソースを 2 通りでビルドして比較する（無効は
# `--no-default-features`）。compat-1-18 は slint 1.18.1 の必須。
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "renderer-femtovg",
    "compat-1-18",
] }
# スクロールイベントを送り込むための要素 API（要素の検索・スクロール送出）。
i-slint-backend-testing = "=1.18.1"
libc = "0.2"

[features]
default = ["a11y"]
# 読み上げ（アクセシビリティ）を有効にする。
a11y = ["slint/accessibility"]

[build-dependencies]
# ui/probe.slint をコンパイルする。
slint-build = "=1.18.1"
