[package]
# 認証スパイク（#97）。passkey（webauthn-rs）と顧客 IdP（openidconnect）を
# axum に組み込めるか確かめるための下書きで、確定スキーマではない。
name = "pelway-auth"
version = "0.0.0"
edition = "2024"
publish = false
description = "Draft authentication spike for the Pelway demo backend (passkey + OIDC RP on axum). Not a fixed schema."

[dependencies]
webauthn-rs = { version = "=0.6.2" }
openidconnect = { version = "=4.1.0" }
axum = { version = "=0.8.9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chrono = "0.4"
rand = "0.10"
# getrandom feature で rsa::rand_core::OsRng（OS 乱数源）が使える。
# rand 0.10 の ThreadRng は rand_core 0.10 系で、rsa 0.9 の rand_core 0.6
# の CryptoRngCore とは互換がないため、鍵生成には OsRng を渡す。
rsa = { version = "0.9", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
webauthn-authenticator-rs = { version = "=0.6.2", features = ["softpasskey"] }
