[package]
# Pelway デスクトップクライアントの中核ロジック（UI 非依存）。Slint への依存を持たない。
# バックエンド契約は pelway-contract（同一ワークスペース）を直接使う（Issue #91）。
name = "pelway-client-core"
version = "0.0.0"
edition = "2024"
publish = false
description = "UI-independent core logic for the Pelway desktop client (no Slint dependency)."

[dependencies]
# バックエンド契約（同一ワークスペースの pelway-contract）を直接使う。
# かつて src/contract.rs に手写しを持っていたが、ずれの恐れがあるため統合した（Issue #91）。
# version は cargo-deny の wildcards 検査（deny.toml の [bans] wildcards = "deny"）のための
# ワイルドカード回避。path 依存の解決には影響しない（publish = false なので公開もしない）。
pelway-contract = { path = "../pelway-contract", version = "0.0.0" }

[dev-dependencies]
# 契約モジュールが pelway-contract の再エクスポートであること(同一型であること)と
# エラーのワイヤ形式(serde タグ)をテストで確かめるために使う。
# version は cargo-deny の wildcards 検査のためのワイルドカード回避（上の [dependencies] と同じ理由）。
pelway-contract = { path = "../pelway-contract", version = "0.0.0" }
serde_json = "1"
