[package]
# Pelway デスクトップクライアントの UI 骨組み。段階B-1: Slint 1.18.1 に依存し、
# build.rs で ui/main.slint をコンパイルする（docs/worklogs/client.md 第9枠）。
# Slint のライセンス（U05）は未決のため、表示の置き場所はまだ決めていない。
name = "pelway-client-ui"
version = "0.0.0"
edition = "2024"
publish = false
description = "Skeleton UI shell for the Pelway desktop client (stage B-1: compiles the Slint skeleton)."

[dependencies]
pelway-client-core = { path = "../pelway-client-core" }
# GUI の枠。版は 1.18.1 に固定（"=" で完全固定）。
slint = "=1.18.1"
# 画面の文言の取得（Fluent）。i18n/{ja,en}/main.ftl を読む。@tr()（gettext）は使わない。
fluent-bundle = "0.15"
# FluentBundle の言語タグ（"ja" / "en"）。
unic-langid = "0.9"

[build-dependencies]
# ui/main.slint をコンパイルして Rust のモジュールを生成する。
slint-build = "=1.18.1"

[dev-dependencies]
# テスト用の backend（窓を開かない）。
i-slint-backend-testing = "=1.18.1"
