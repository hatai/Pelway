[package]
# Pelway デスクトップクライアントの UI 骨組み。段階B-1: Slint 1.18.1 に依存し、
# build.rs で ui/main.slint をコンパイルする（docs/worklogs/client.md 第9枠）。
# Slint の attribution（Royalty-free License 2.0 §2 (a)）は、トップレベル
# メニューから開く About ダイアログの AboutSlint widget で表示する（#237）。
name = "pelway-client-ui"
version = "0.0.0"
edition = "2024"
publish = false
description = "Skeleton UI shell for the Pelway desktop client (stage B-1: compiles the Slint skeleton)."

[dependencies]
pelway-client-core = { path = "../pelway-client-core", version = "0.0.0" } # version は cargo-deny の wildcards 検査のため（path 依存の解決には影響しない）
# ワイヤ上の型（Channel・StoredMessage 等。#327 の契約と同じ定義を共有する）。
pelway-contract = { path = "../pelway-contract", version = "0.0.0" }
# GUI の枠。版は 1.18.1 に固定（"=" で完全固定）。
slint = "=1.18.1"
# 画面の文言の取得（Fluent）。i18n/{ja,en}/main.ftl を読む。@tr()（gettext）は使わない。
fluent-bundle = "0.16"
# FluentBundle の言語タグ（"ja" / "en"）。
unic-langid = "0.9"
# サーバーとの JSON（#327 の応答のデコード・投稿ボディのエンコード）。
serde = "1"
serde_json = "1"
# 冪等キー・client_msg_id の UUID v4。
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# ui/main.slint をコンパイルして Rust のモジュールを生成する。
slint-build = "=1.18.1"

[dev-dependencies]
# テスト用の backend（窓を開かない）。
i-slint-backend-testing = "=1.18.1"
# 結合テスト（tests/live.rs）が実サーバーを立てるためのサーバー実体。
pelway-http = { path = "../pelway-http", version = "0.0.0" }
