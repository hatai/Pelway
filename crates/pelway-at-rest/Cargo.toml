[package]
# 保存時の分割 AES-256-GCM コンテナ（下書き）。Pelway 独自の形式で、他の形式との互換はない。
# 鍵の管理・復旧は未決 U05。ここでは決めない。
name = "pelway-at-rest"
version = "0.0.0"
edition = "2024"
publish = false
description = "Draft chunked AES-256-GCM container for data at rest (Pelway-specific format)."

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "getrandom", "zeroize"] }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
zeroize = "1"
