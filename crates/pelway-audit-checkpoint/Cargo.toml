[package]
# 監査ログの prev_hash 鎖に署名付きチェックポイントを足す下書き（Issue #102、ADR 0007）。
# C2SP signed-note の署名形式を参考にした独自形式で、確定したスキーマではない。
name = "pelway-audit-checkpoint"
version = "0.0.0"
edition = "2024"
publish = false
description = "Draft signed checkpoints for the Pelway audit log hash chain (C2SP signed-note based). Not a fixed schema."

[dependencies]
# 署名行・ハッシュ行の base64（RFC 4648・パディングあり。正規形以外は弾く）。
base64 = "0.22"
# チェックポイントの署名（RFC 8032 Ed25519）。既定の機能に zeroize が入る。
# rand_core 機能で SigningKey::generate（OS 乱数源からの鍵生成）が使える。
ed25519-dalek = { version = "2", features = ["rand_core"] }
# NoteSigner::generate の OS 乱数源（ed25519-dalek 2.x と同じ 0.6 系）。
rand_core = { version = "0.6", features = ["getrandom"] }
# 行ハッシュ・鍵 ID の SHA-256。
sha2 = { version = "0.10", default-features = false }
