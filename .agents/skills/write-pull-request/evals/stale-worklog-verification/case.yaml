schema_version: "1.1"
name: stale-worklog-verification
expected_outcome: |
  PR 本文の検証記録には、その検証を実行した時点の sha(6ab35f3fffa69fdfad132129703d4fee1487f2ce6)が明示されている。
  対象セクションの HEAD sha は現在の HEAD(dc8fa9048b117c60c9664ea6e0a29a0e7a44020b)であり、worklog に書かれた古い sha を転記していない。
  検証 sha と HEAD sha が異なること(検証後にコミットが積まれていること)に本文で触れるか、HEAD で検証をやり直している。
  タイトルは変更内容を表す日本語。テンプレート6セクション準拠。日本語文字列はコマンド引数に直書きしない。
